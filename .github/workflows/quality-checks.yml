
name: San Yallego - Quality Checks

on:
  push:
    branches:
      - chore/quality-checks
      - feature/recorrido-cinematografico-10-sitios
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript and Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ESLint
        run: pnpm exec eslint .

      - name: Check TypeScript
        run: pnpm run typecheck

      - name: Run security tests
        run: pnpm run test:security

      - name: Build application
        run: pnpm run build

      - name: Install pinned Chromium browser for integration tests
        run: |
          npm install --prefix "$RUNNER_TEMP/sy-playwright" --no-save --no-package-lock playwright@1.55.0
          node "$RUNNER_TEMP/sy-playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Start local production build for browser tests
        run: |
          pnpm exec next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/sy-next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/libro/1 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/sy-next.log"
          exit 1

      - name: Browser E2E - 33 chapters, media and 8 sealed sites
        env:
          SY_BASE_URL: http://127.0.0.1:3000
          SY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/sy-playwright/node_modules/playwright/index.mjs
        run: node scripts/e2e-libro-1.mjs

      - name: Print local Next logs if test fails
        if: failure()
        run: cat "$RUNNER_TEMP/sy-next.log" || true
